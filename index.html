<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>영어 단어 퀴즈</title>

  <!-- Supabase JavaScript v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f5fb;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
      color: #3b5bdb;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    .progress {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 12px;
    }

    .word {
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      margin: 24px 0;
      color: #222;
    }

    .question {
      text-align: center;
      font-size: 17px;
      margin-bottom: 20px;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice {
      min-height: 58px;
      border: 2px solid #e0e5f0;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      padding: 12px;
    }

    .choice:hover:not(:disabled) {
      border-color: #748ffc;
      background: #f5f7ff;
    }

    .choice:disabled {
      cursor: default;
      opacity: 1;
    }

    .choice.correct {
      background: #e6fcf5;
      border-color: #20c997;
      color: #087f5b;
      font-weight: bold;
    }

    .choice.wrong {
      background: #fff0f0;
      border-color: #fa5252;
      color: #c92a2a;
      font-weight: bold;
    }

    .feedback {
      min-height: 48px;
      text-align: center;
      font-weight: bold;
      margin-top: 20px;
      line-height: 1.6;
    }

    .feedback.correct {
      color: #087f5b;
    }

    .feedback.wrong {
      color: #c92a2a;
    }

    .feedback.info {
      color: #555;
    }

    .save-status {
      min-height: 24px;
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .main-button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #4263eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button:hover {
      background: #364fc7;
    }

    .main-button:disabled {
      background: #adb5bd;
      cursor: default;
    }

    .score {
      font-size: 30px;
      text-align: center;
      font-weight: bold;
      color: #3b5bdb;
      margin: 24px 0;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 420px) {
      .container {
        padding: 22px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .word {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Word Quiz</h1>

    <p class="subtitle">
      영어 단어의 뜻을 선택하세요.
    </p>

    <!-- 퀴즈 화면 -->
    <section id="quiz-screen">

      <div class="progress" id="progress">
        문제 1 / 3
      </div>

      <div class="word" id="word">
        abundant
      </div>

      <div class="question">
        다음 영어 단어의 뜻으로 알맞은 것을 고르세요.
      </div>

      <div class="choices" id="choices"></div>

      <div class="feedback" id="feedback"></div>

      <div class="save-status" id="save-status"></div>

      <button
        class="main-button hidden"
        id="next-button"
        type="button"
      >
        다음 문제
      </button>

    </section>

    <!-- 결과 화면 -->
    <section id="result-screen" class="hidden">

      <h2 style="text-align:center;">
        퀴즈 완료!
      </h2>

      <div class="score" id="score">
        0 / 3
      </div>

      <p style="text-align:center;">
        모든 문제를 풀었습니다.
      </p>

      <div class="save-status" id="final-save-status"></div>

      <button
        class="main-button"
        id="restart-button"
        type="button"
      >
        다시 풀기
      </button>

    </section>

  </main>

  <script>
    // =========================================
    // 1. Supabase 설정
    // =========================================

    const SUPABASE_URL = "https://ssbgndwefhhzjtjgvdse.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jmNfOT0T1U5MUR_QQavkcw_WxYI_0Xr";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // =========================================
    // 2. 퀴즈 문제
    // =========================================

    const questions = [
      {
        question_no: 1,
        english_word: "abundant",
        choices: [
          "조용한",
          "풍부한",
          "위험한",
          "느린"
        ],
        correct_answer: "풍부한"
      },

      {
        question_no: 2,
        english_word: "reluctant",
        choices: [
          "주저하는",
          "열정적인",
          "정확한",
          "부지런한"
        ],
        correct_answer: "주저하는"
      },

      {
        question_no: 3,
        english_word: "brief",
        choices: [
          "강력한",
          "평범한",
          "짧은",
          "불규칙한"
        ],
        correct_answer: "짧은"
      }
    ];


    // =========================================
    // 3. DOM 요소
    // =========================================

    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    const progressElement = document.getElementById("progress");
    const wordElement = document.getElementById("word");
    const choicesElement = document.getElementById("choices");

    const feedbackElement = document.getElementById("feedback");
    const saveStatusElement = document.getElementById("save-status");

    const nextButton = document.getElementById("next-button");
    const restartButton = document.getElementById("restart-button");

    const scoreElement = document.getElementById("score");
    const finalSaveStatusElement =
      document.getElementById("final-save-status");


    // =========================================
    // 4. 퀴즈 상태
    // =========================================

    let currentQuestionIndex = 0;

    let score = 0;

    // 퀴즈 1회 응시를 구분하는 UUID
    let attemptId = null;

    // 현재 문제의 표시 시작 시간
    let questionStartTime = null;

    // 응시별 저장 성공/실패 상태
    let saveResults = [];

    // 현재 문제에 답했는지 확인
    let answered = false;


    // =========================================
    // 5. 퀴즈 시작
    // =========================================

    function startQuiz() {

      // 새로운 퀴즈 응시 ID 생성
      attemptId = crypto.randomUUID();

      currentQuestionIndex = 0;

      score = 0;

      saveResults = [];

      answered = false;

      quizScreen.classList.remove("hidden");
      resultScreen.classList.add("hidden");

      renderQuestion();

    }


    // =========================================
    // 6. 문제 표시
    // =========================================

    function renderQuestion() {

      const question = questions[currentQuestionIndex];

      answered = false;

      progressElement.textContent =
        `문제 ${currentQuestionIndex + 1} / ${questions.length}`;

      wordElement.textContent = question.english_word;

      choicesElement.innerHTML = "";

      feedbackElement.textContent = "";

      feedbackElement.className = "feedback";

      saveStatusElement.textContent = "";

      nextButton.classList.add("hidden");

      // 보기 버튼 생성
      question.choices.forEach((choice) => {

        const button = document.createElement("button");

        button.type = "button";

        button.className = "choice";

        button.textContent = choice;

        button.addEventListener("click", () => {

          selectAnswer(choice, button);

        });

        choicesElement.appendChild(button);

      });

      // 문제를 화면에 표시한 후 응답 시간 측정 시작
      questionStartTime = performance.now();

    }


    // =========================================
    // 7. 답 선택
    // =========================================

    async function selectAnswer(selectedAnswer, selectedButton) {

      // 한 문제에 한 번만 응답 가능
      if (answered) {
        return;
      }

      answered = true;

      // 응답 시간 계산
      const responseTime = Math.max(
        0,
        Math.round(performance.now() - questionStartTime)
      );

      const question = questions[currentQuestionIndex];

      const isCorrect =
        selectedAnswer === question.correct_answer;


      // 모든 보기 비활성화
      const buttons = choicesElement.querySelectorAll("button");

      buttons.forEach((button) => {

        button.disabled = true;

        if (button.textContent === question.correct_answer) {

          button.classList.add("correct");

        }

      });


      // 선택한 답 표시
      if (isCorrect) {

        score++;

        feedbackElement.textContent = "정답입니다!";

        feedbackElement.classList.add("correct");

      } else {

        selectedButton.classList.add("wrong");

        feedbackElement.textContent =
          `오답입니다. 정답은 "${question.correct_answer}"입니다.`;

        feedbackElement.classList.add("wrong");

      }


      // Supabase 저장
      saveStatusElement.textContent = "응답 저장 중...";

      const saveResult = await saveAnswer({

        attempt_id: attemptId,

        question_no: question.question_no,

        english_word: question.english_word,

        chosen_answer: selectedAnswer,

        is_correct: isCorrect,

        response_time_ms: responseTime

      });


      // 저장 결과 기록
      saveResults.push(saveResult);


      // 저장 성공/실패 표시
      if (saveResult.success) {

        saveStatusElement.textContent = "응답 저장 완료";

      } else {

        saveStatusElement.textContent =
          "응답 저장 실패. 퀴즈는 계속 진행할 수 있습니다.";

      }


      // 다음 문제 또는 결과 버튼 표시
      if (currentQuestionIndex < questions.length - 1) {

        nextButton.textContent = "다음 문제";

      } else {

        nextButton.textContent = "결과 확인";

      }

      nextButton.classList.remove("hidden");

    }


    // =========================================
    // 8. Supabase INSERT
    // =========================================

    async function saveAnswer(answerData) {

      try {

        const { error } = await supabaseClient
          .from("quiz_answers")
          .insert({

            attempt_id: answerData.attempt_id,

            question_no: answerData.question_no,

            english_word: answerData.english_word,

            chosen_answer: answerData.chosen_answer,

            is_correct: answerData.is_correct,

            response_time_ms: answerData.response_time_ms

          });


        if (error) {

          console.error("Supabase 저장 오류:", error);

          return {
            success: false,
            question_no: answerData.question_no
          };

        }


        return {
          success: true,
          question_no: answerData.question_no
        };


      } catch (error) {

        console.error("응답 저장 중 오류:", error);

        return {
          success: false,
          question_no: answerData.question_no
        };

      }

    }


    // =========================================
    // 9. 다음 문제 / 결과 화면
    // =========================================

    nextButton.addEventListener("click", () => {

      if (!answered) {
        return;
      }

      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {

        renderQuestion();

      } else {

        showResult();

      }

    });


    // =========================================
    // 10. 결과 화면
    // =========================================

    function showResult() {

      quizScreen.classList.add("hidden");

      resultScreen.classList.remove("hidden");

      scoreElement.textContent = `${score} / 3`;

      const successCount = saveResults.filter(
        result => result.success
      ).length;

      const failureCount = saveResults.length - successCount;


      if (failureCount === 0) {

        finalSaveStatusElement.textContent =
          "응답 3개가 모두 저장되었습니다.";

      } else {

        finalSaveStatusElement.textContent =
          `저장 성공 ${successCount}개 / 실패 ${failureCount}개. ` +
          "저장 실패 응답은 Supabase에 기록되지 않았습니다.";

      }

    }


    // =========================================
    // 11. 다시 풀기
    // =========================================

    restartButton.addEventListener("click", () => {

      // startQuiz()에서 새로운 attempt_id 생성
      startQuiz();

    });


    // =========================================
    // 12. 최초 실행
    // =========================================

    startQuiz();

  </script>

</body>
</html>
